<title>AI Receptionist — Live Demo</title>
<style>
  :root {
    --bg: #EDE9E1;
    --surface: #F7F4EE;
    --ink: #23262E;
    --ink-soft: #5B5A54;
    --accent: #C4622D;
    --accent-soft: #E4C9B4;
    --teal: #3E5A63;
    --line: #DAD4C6;
    --bubble-ai: #F7F4EE;
    --bubble-caller: #23262E;
    --bubble-caller-ink: #F7F4EE;
    --shadow: 0 1px 2px rgba(35,38,46,0.06), 0 8px 24px rgba(35,38,46,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191C22; --surface: #22262E; --ink: #ECE9E2; --ink-soft: #A6A296;
      --accent: #E08248; --accent-soft: #4A3428; --teal: #8FB0B8; --line: #343943;
      --bubble-ai: #2B2F38; --bubble-caller: #E08248; --bubble-caller-ink: #191C22;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191C22; --surface: #22262E; --ink: #ECE9E2; --ink-soft: #A6A296;
    --accent: #E08248; --accent-soft: #4A3428; --teal: #8FB0B8; --line: #343943;
    --bubble-ai: #2B2F38; --bubble-caller: #E08248; --bubble-caller-ink: #191C22;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    --bg: #EDE9E1; --surface: #F7F4EE; --ink: #23262E; --ink-soft: #5B5A54;
    --accent: #C4622D; --accent-soft: #E4C9B4; --teal: #3E5A63; --line: #DAD4C6;
    --bubble-ai: #F7F4EE; --bubble-caller: #23262E; --bubble-caller-ink: #F7F4EE;
    --shadow: 0 1px 2px rgba(35,38,46,0.06), 0 8px 24px rgba(35,38,46,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 28px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .header {
    text-align: center; margin-bottom: 22px;
  }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0 0 6px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 25px; font-weight: 600; margin: 0; text-wrap: balance;
  }

  .phone {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .phone-top {
    background: var(--teal);
    color: var(--surface);
    padding: 18px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7FD68A; flex-shrink: 0; }
  .phone-top-text { line-height: 1.3; }
  .phone-top-text b { display: block; font-size: 15px; }
  .phone-top-text span { font-size: 12px; opacity: 0.8; }

  .transcript {
    padding: 20px;
    min-height: 320px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 80%; padding: 11px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4;
    opacity: 0; transform: translateY(6px); animation: rise 0.35s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.caller { align-self: flex-end; background: var(--bubble-caller); color: var(--bubble-caller-ink); border-bottom-right-radius: 4px; }
  .msg.card { align-self: center; background: var(--accent-soft); color: var(--ink); border-radius: 14px; text-align: center; font-size: 13.5px; padding: 12px 16px; max-width: 92%; }
  .msg.card b { color: var(--accent); }

  .scenarios {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 0 20px 20px;
  }
  .scenario-btn {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 10px; font-size: 13.5px; color: var(--ink);
    cursor: pointer; text-align: center; line-height: 1.3;
    transition: border-color 0.15s ease;
  }
  .scenario-btn:hover { border-color: var(--accent); }
  .scenario-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scenario-btn.active { border-color: var(--accent); background: var(--accent-soft); }

  .note {
    text-align: center; font-size: 12.5px; color: var(--ink-soft);
    margin: 18px 0 0; line-height: 1.5; max-width: 42ch; margin-left: auto; margin-right: auto;
  }
</style>

<div class="wrap">
  <div class="header">
    <p class="eyebrow">Live preview</p>
    <h1>Your AI Receptionist, in action</h1>
  </div>

  <div class="phone">
    <div class="phone-top">
      <div class="dot"></div>
      <div class="phone-top-text">
        <b>Answering now</b>
        <span>Never goes to voicemail — 24/7</span>
      </div>
    </div>
    <div class="transcript" id="transcript"></div>
    <div class="scenarios" id="scenarios">
      <button class="scenario-btn" data-s="0">"My AC stopped cooling"</button>
      <button class="scenario-btn" data-s="1">"Need a maintenance check"</button>
      <button class="scenario-btn" data-s="2">"How much for a quote?"</button>
      <button class="scenario-btn" data-s="3">"It's an emergency"</button>
    </div>
  </div>

  <p class="note">Tap a scenario to see how the AI handles a real caller — greets them, understands the problem, and books the job. This is what runs on every missed call, automatically.</p>
</div>

<script>
  const scenarios = [
    [
      {who:'ai', text:"Thanks for calling — this is the AI assistant for your HVAC team. What's going on with your system today?"},
      {who:'caller', text:"Hi, my AC just stopped cooling completely."},
      {who:'ai', text:"Sorry to hear that — in this heat that's urgent. Is the unit running but blowing warm air, or not turning on at all?"},
      {who:'caller', text:"It's running, just blowing warm air."},
      {who:'ai', text:"Got it, that's usually a quick fix for our techs. I have openings tomorrow at 9am or 1pm — which works better?"},
      {who:'caller', text:"1pm works."},
      {who:'card', text:"<b>✓ Booked</b> — Tomorrow 1:00 PM · AC not cooling · Customer notified by text"},
    ],
    [
      {who:'ai', text:"Thanks for calling — this is the AI assistant for your HVAC team. How can I help?"},
      {who:'caller', text:"I'd like to book a routine maintenance check."},
      {who:'ai', text:"Happy to set that up. Have you had service with us before, or is this your first visit?"},
      {who:'caller', text:"First time."},
      {who:'ai', text:"Welcome! I have Thursday at 10am or Friday at 2pm open for a full system check — which is better?"},
      {who:'caller', text:"Thursday, please."},
      {who:'card', text:"<b>✓ Booked</b> — Thursday 10:00 AM · Routine maintenance · New customer intake sent"},
    ],
    [
      {who:'ai', text:"Thanks for calling — this is the AI assistant for your HVAC team. What can I help with?"},
      {who:'caller', text:"I just want to know how much a new AC install would cost."},
      {who:'ai', text:"I can get you an exact quote — it depends on your home size and current system. Can I have one of our techs come take a quick look?"},
      {who:'caller', text:"Sure, sounds good."},
      {who:'ai', text:"I have a free estimate visit open Monday at 11am — does that work?"},
      {who:'caller', text:"Yes, that works."},
      {who:'card', text:"<b>✓ Booked</b> — Monday 11:00 AM · Free estimate · Quote follow-up scheduled"},
    ],
    [
      {who:'ai', text:"Thanks for calling — this is the AI assistant for your HVAC team. What's the emergency?"},
      {who:'caller', text:"No AC at all, and I've got a newborn at home — it's 110 outside."},
      {who:'ai', text:"Understood, I'm marking this urgent right now. I have a tech who can be there within the hour — is that address still 4th Street?"},
      {who:'caller', text:"Yes, that's right."},
      {who:'ai', text:"Confirmed — they're on their way now, and I've texted you their ETA."},
      {who:'card', text:"<b>🚨 Priority booked</b> — Tech dispatched, ETA under 1hr · Emergency: no cooling"},
    ],
  ];

  const transcript = document.getElementById('transcript');
  const buttons = document.querySelectorAll('.scenario-btn');
  let running = false;

  function playScenario(idx) {
    if (running) return;
    running = true;
    buttons.forEach(b => b.classList.remove('active'));
    buttons[idx].classList.add('active');
    transcript.innerHTML = '';
    const steps = scenarios[idx];
    let i = 0;
    function next() {
      if (i >= steps.length) { running = false; return; }
      const step = steps[i];
      const el = document.createElement('div');
      el.className = 'msg ' + step.who;
      el.innerHTML = step.text;
      transcript.appendChild(el);
      transcript.scrollTop = transcript.scrollHeight;
      i++;
      setTimeout(next, step.who === 'card' ? 200 : 750);
    }
    next();
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => playScenario(parseInt(btn.dataset.s)));
  });

  playScenario(0);
</script>
